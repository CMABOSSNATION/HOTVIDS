<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOTVID – Profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap');

  :root {
    --hot: #ff2d55;
    --bg: #0a0a0a;
    --card: #141414;
    --text: #ffffff;
    --muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .profile-header {
    position: relative;
    padding: 60px 20px 20px;
    text-align: center;
    background: linear-gradient(180deg, #1a0a0f 0%, var(--bg) 100%);
  }

  .back-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    background: #1a1a1a;
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 12px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--hot);
  }

  .avatar-placeholder {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2d55, #ff6b35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    border: 3px solid var(--hot);
    margin: 0 auto;
  }

  .username {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .bio {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
  }

  /* STATS ROW */
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 20px;
  }

  .stat-item {
    text-align: center;
    cursor: pointer;
  }

  .stat-number {
    font-size: 20px;
    font-weight: 700;
    color: white;
  }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* FOLLOW BUTTON */
  .follow-btn {
    padding: 10px 40px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    margin-bottom: 8px;
  }

  .follow-btn.not-following {
    background: var(--hot);
    color: white;
  }

  .follow-btn.following {
    background: transparent;
    color: white;
    border: 1.5px solid #333;
  }

  .follow-btn:active { transform: scale(0.96); }

  .message-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid #333;
    background: transparent;
    color: white;
    margin-left: 8px;
    transition: all 0.2s;
  }

  .message-btn:active { transform: scale(0.96); }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid #1a1a1a;
    margin-top: 8px;
  }

  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: white;
    border-bottom-color: var(--hot);
  }

  /* VIDEO GRID */
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
  }

  .video-thumb {
    aspect-ratio: 9/16;
    background: var(--card);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-thumb-views {
    position: absolute;
    bottom: 4px;
    left: 4px;
    font-size: 11px;
    font-weight: 700;
    color: white;
    text-shadow: 0 1px 3px #000;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* FOLLOWERS MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: #00000090;
    z-index: 200;
    display: none;
    align-items: flex-end;
  }

  .modal-overlay.open { display: flex; }

  .modal-sheet {
    background: #111;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #1a1a1a;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
  }

  .modal-close {
    background: #1a1a1a;
    border: none;
    color: #888;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
  }

  .user-row:active { background: #1a1a1a; }

  .user-row-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: linear-gradient(135deg, #ff2d55, #ff6b35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .user-row-info { flex: 1; }
  .user-row-name { font-size: 14px; font-weight: 700; }
  .user-row-followers { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .user-row-follow-btn {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: var(--hot);
    color: white;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* SKELETON */
  .skeleton {
    background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0a0a0af0;
    backdrop-filter: blur(10px);
    border-top: 1px solid #1a1a1a;
    display: flex;
    justify-content: space-around;
    padding: 10px 0 20px;
    z-index: 100;
  }

  .bottom-nav a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
  }

  .bottom-nav a.active { color: var(--hot); }
  .bottom-nav a .icon { font-size: 22px; }

  .spacer { height: 80px; }
</style>
</head>
<body>

<!-- PROFILE HEADER -->
<div class="profile-header">
  <button class="back-btn" onclick="history.back()">←</button>

  <div class="avatar-wrap">
    <div class="avatar-placeholder" id="avatarPlaceholder">?</div>
  </div>

  <div class="username" id="profileUsername">Loading...</div>
  <div class="bio" id="profileBio"></div>

  <div class="stats-row">
    <div class="stat-item" onclick="openModal('following')">
      <div class="stat-number" id="followingCount">0</div>
      <div class="stat-label">Following</div>
    </div>
    <div class="stat-item" onclick="openModal('followers')">
      <div class="stat-number" id="followersCount">0</div>
      <div class="stat-label">Followers</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="likesCount">0</div>
      <div class="stat-label">Likes</div>
    </div>
  </div>

  <div id="profileActions" style="display:none">
    <button class="follow-btn not-following" id="followBtn" onclick="toggleFollow()">Follow</button>
    <button class="message-btn">Message</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('videos', this)">📹 Videos</div>
  <div class="tab" onclick="switchTab('liked', this)">❤️ Liked</div>
</div>

<!-- VIDEOS GRID -->
<div class="videos-grid" id="videosGrid"></div>

<div class="spacer"></div>

<!-- FOLLOWERS/FOLLOWING MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Followers</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Home</a>
  <a href="trending.html"><span class="icon">🔥</span>Trending</a>
  <a href="upload.html"><span class="icon">➕</span>Upload</a>
  <a href="#"><span class="icon">💬</span>Inbox</a>
  <a href="profile.html" class="active"><span class="icon">👤</span>Profile</a>
</nav>

<script>
  const API = 'http://178.105.190.123:3000';
  const params = new URLSearchParams(window.location.search);
  const profileUserId = params.get('id') || JSON.parse(localStorage.getItem('hvu') || '{}').id;
  const myId = JSON.parse(localStorage.getItem('hvu') || '{}').id;
  let isFollowing = false;

  const fmt = (n) => {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return n || 0;
  };

  async function loadProfile() {
    try {
      const res = await fetch(`${API}/api/users/${profileUserId}/profile`);
      const data = await res.json();
      if (!data.success) return;

      const u = data.data;
      document.title = `@${u.username} – HOTVID`;
      document.getElementById('profileUsername').textContent = '@' + u.username;
      document.getElementById('profileBio').textContent = u.bio || '';
      document.getElementById('followersCount').textContent = fmt(u.followers_count);
      document.getElementById('followingCount').textContent = fmt(u.following_count);
      document.getElementById('likesCount').textContent = fmt(u.total_likes);

      const placeholder = document.getElementById('avatarPlaceholder');
      placeholder.textContent = u.username[0].toUpperCase();

      // Show follow button only for other users
      if (myId && myId != profileUserId) {
        document.getElementById('profileActions').style.display = 'block';
        checkFollowStatus();
      }

      loadVideos();
    } catch (err) {
      console.error('loadProfile error:', err);
    }
  }

  async function checkFollowStatus() {
    const token = localStorage.getItem('hvt');
    if (!token) return;
    try {
      const res = await fetch(`${API}/api/users/${profileUserId}/follow-status`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success) updateFollowBtn(data.following);
    } catch (e) {}
  }

  async function toggleFollow() {
    const token = localStorage.getItem('hvt');
    if (!token) { alert('Login to follow creators'); return; }

    const btn = document.getElementById('followBtn');
    btn.disabled = true;

    try {
      const res = await fetch(`${API}/api/users/${profileUserId}/follow`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success) {
        updateFollowBtn(data.following);
        // Update count
        const el = document.getElementById('followersCount');
        const current = parseInt(el.textContent) || 0;
        el.textContent = fmt(data.following ? current + 1 : current - 1);
      }
    } catch (err) {
      console.error('toggleFollow error:', err);
    }
    btn.disabled = false;
  }

  function updateFollowBtn(following) {
    isFollowing = following;
    const btn = document.getElementById('followBtn');
    btn.textContent = following ? 'Following' : 'Follow';
    btn.className = 'follow-btn ' + (following ? 'following' : 'not-following');
  }

  async function loadVideos() {
    try {
      const res = await fetch(`${API}/api/videos?user_id=${profileUserId}&limit=30`);
      const data = await res.json();
      const grid = document.getElementById('videosGrid');

      if (!data.success || !data.data?.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <div class="icon">🎬</div>
          <div>No videos yet</div>
        </div>`;
        return;
      }

      grid.innerHTML = data.data.map(v => `
        <div class="video-thumb" onclick="window.location='feed.html?v=${v.id}'">
          <img
            src="${v.thumbnail_url || 'https://placehold.co/200x355/141414/333?text=▶'}"
            alt="${v.title || ''}"
            loading="lazy"
            onerror="this.src='https://placehold.co/200x355/141414/333?text=▶'"
          />
          <div class="video-thumb-views">👁️ ${fmt(v.view_count)}</div>
        </div>
      `).join('');
    } catch (err) {
      console.error('loadVideos error:', err);
    }
  }

  async function openModal(type) {
    document.getElementById('modalTitle').textContent =
      type === 'followers' ? 'Followers' : 'Following';
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('modalList').innerHTML =
      '<div style="padding:20px;text-align:center;color:#555">Loading...</div>';

    try {
      const endpoint = type === 'followers'
        ? `/api/users/${profileUserId}/followers`
        : `/api/users/${profileUserId}/following`;
      const res = await fetch(`${API}${endpoint}`);
      const data = await res.json();
      renderUserList(data.data || []);
    } catch (e) {
      document.getElementById('modalList').innerHTML =
        '<div style="padding:20px;text-align:center;color:#555">Failed to load</div>';
    }
  }

  function renderUserList(users) {
    const list = document.getElementById('modalList');
    if (!users.length) {
      list.innerHTML = '<div style="padding:30px;text-align:center;color:#555">No users yet</div>';
      return;
    }
    list.innerHTML = users.map(u => `
      <div class="user-row" onclick="window.location='profile.html?id=${u.id}'">
        <div class="user-row-avatar">${u.username[0].toUpperCase()}</div>
        <div class="user-row-info">
          <div class="user-row-name">@${u.username}</div>
          <div class="user-row-followers">${fmt(u.followers_count)} followers</div>
        </div>
      </div>
    `).join('');
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'videos') loadVideos();
    // liked tab - wire up when ready
  }

  loadProfile();
</script>
</body>
</html>
