<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOTVID – Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hot: #ff2d55;
    --hot2: #ff6b35;
    --bg: #0a0a0a;
    --card: #141414;
    --border: #1e1e1e;
    --text: #ffffff;
    --muted: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  /* HEADER */
  .profile-header {
    position: relative;
    padding: 56px 20px 0;
    text-align: center;
    background: linear-gradient(180deg, #1a0a10 0%, var(--bg) 100%);
  }
  .back-btn {
    position: absolute; top: 14px; left: 14px;
    background: rgba(255,255,255,0.08); border: none; color: white;
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .settings-btn {
    position: absolute; top: 14px; right: 14px;
    background: rgba(255,255,255,0.08); border: none; color: white;
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* AVATAR */
  .avatar-wrap { position: relative; display: inline-block; margin-bottom: 10px; }
  .avatar, .avatar-placeholder {
    width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--hot);
  }
  .avatar { object-fit: cover; display: block; }
  .avatar-placeholder {
    background: linear-gradient(135deg, var(--hot), var(--hot2));
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; margin: 0 auto;
  }
  .avatar-edit-btn {
    position: absolute; bottom: 0; right: 0;
    background: var(--hot); border: 2px solid var(--bg); color: white;
    width: 26px; height: 26px; border-radius: 50%; font-size: 13px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    border: none;
  }
  .avatar-edit-btn.visible { display: flex; }
  #avatarInput { display: none; }

  .username { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
  .handle { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bio { font-size: 13px; color: #ccc; margin-bottom: 10px; max-width: 280px; margin-left: auto; margin-right: auto; line-height: 1.5; }

  /* SOCIAL LINKS */
  .social-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .social-link {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.07); font-size: 12px; color: #ccc;
    text-decoration: none; transition: background 0.2s;
  }
  .social-link:active { background: rgba(255,255,255,0.14); }
  .social-link .sl-icon { font-size: 14px; }

  /* STATS ROW */
  .stats-row { display: flex; justify-content: center; gap: 0; margin-bottom: 16px; }
  .stat-item {
    flex: 1; max-width: 90px; text-align: center;
    cursor: pointer; padding: 10px 6px;
    border-right: 1px solid var(--border);
  }
  .stat-item:last-child { border-right: none; }
  .stat-number { font-size: 18px; font-weight: 700; color: white; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* WALLET BALANCE PILL */
  .wallet-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, #1a0a10, #1a1a00);
    border: 1px solid #2a2a1a; border-radius: 20px;
    padding: 6px 14px; font-size: 13px; margin-bottom: 14px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .wallet-pill:active { border-color: var(--hot); }
  .wallet-pill .wp-coin { font-size: 16px; }
  .wallet-pill .wp-label { color: var(--muted); font-size: 11px; }
  .wallet-pill .wp-amount { font-weight: 700; color: #ffd700; }

  /* BUTTONS */
  .action-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 4px; }
  .follow-btn {
    padding: 9px 36px; border-radius: 8px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; transition: all 0.2s;
  }
  .follow-btn.not-following { background: var(--hot); color: white; }
  .follow-btn.following { background: transparent; color: white; border: 1.5px solid #333; }
  .follow-btn:active { transform: scale(0.96); }
  .msg-btn, .edit-btn {
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: transparent; color: white; border: 1.5px solid #333;
    transition: all 0.2s;
  }
  .msg-btn:active, .edit-btn:active { transform: scale(0.96); border-color: #555; }

  /* PHONE / CONTACT */
  .contact-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
  .contact-row span { display: flex; align-items: center; gap: 4px; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab.active { color: white; border-bottom-color: var(--hot); }

  /* VIDEO GRID */
  .videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
  .video-thumb { aspect-ratio: 9/16; background: var(--card); position: relative; overflow: hidden; cursor: pointer; }
  .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .video-thumb-meta {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 4px; background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
    display: flex; align-items: center; justify-content: space-between;
  }
  .vt-views { font-size: 10px; font-weight: 700; color: white; display: flex; align-items: center; gap: 2px; }
  .vt-likes { font-size: 10px; color: #ff6b6b; display: flex; align-items: center; gap: 2px; }

  /* LIKED VIDEOS TAB – same grid */
  .liked-empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .liked-empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #111; border-radius: 20px 20px 0 0; width: 100%;
    max-height: 75vh; display: flex; flex-direction: column;
  }
  .modal-handle { width: 36px; height: 4px; background: #333; border-radius: 2px; margin: 12px auto 0; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-close { background: #1a1a1a; border: none; color: #888; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; }
  .modal-list { overflow-y: auto; flex: 1; padding: 8px 0; }
  .user-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; }
  .user-row:active { background: #1a1a1a; }
  .user-row-avatar {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
    background: linear-gradient(135deg, var(--hot), var(--hot2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0; overflow: hidden;
  }
  .user-row-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .user-row-info { flex: 1; }
  .user-row-name { font-size: 14px; font-weight: 700; }
  .user-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* EDIT PROFILE MODAL */
  #editModal .modal-sheet { max-height: 90vh; }
  .edit-form { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .edit-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .edit-field input, .edit-field textarea {
    width: 100%; background: #1a1a1a; border: 1px solid var(--border);
    color: white; border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s;
  }
  .edit-field input:focus, .edit-field textarea:focus { border-color: var(--hot); }
  .edit-field textarea { resize: none; height: 72px; }
  .edit-section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding-top: 4px; }
  .save-btn {
    width: 100%; background: var(--hot); color: white; border: none;
    border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 4px; transition: opacity 0.2s;
  }
  .save-btn:active { opacity: 0.85; }

  /* TOAST */
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #222; color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0;
    transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
    border: 1px solid #333;
  }
  #toast.show { opacity: 1; }

  /* SKELETON */
  .skeleton { background: linear-gradient(90deg,#1a1a1a 25%,#252525 50%,#1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 10px 0 20px; z-index: 100;
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; text-decoration: none; color: var(--muted); font-size: 10px; font-weight: 600;
  }
  .bottom-nav a.active { color: var(--hot); }
  .bottom-nav a .icon { font-size: 22px; }
  .spacer { height: 80px; }
</style>
</head>
<body>

<!-- PROFILE HEADER -->
<div class="profile-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <button class="settings-btn" id="settingsBtn" style="display:none" onclick="openEditModal()">⚙️</button>

  <div class="avatar-wrap">
    <div class="avatar-placeholder" id="avatarPlaceholder">?</div>
    <img class="avatar" id="avatarImg" style="display:none" alt="avatar">
    <button class="avatar-edit-btn" id="avatarEditBtn" onclick="document.getElementById('avatarInput').click()">✏️</button>
    <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarChange(event)">
  </div>

  <div class="username" id="profileUsername">Loading...</div>
  <div class="handle" id="profileHandle"></div>
  <div class="bio" id="profileBio"></div>

  <!-- Social Links -->
  <div class="social-links" id="socialLinks"></div>

  <!-- Contact info (own profile) -->
  <div class="contact-row" id="contactRow" style="display:none"></div>

  <!-- Wallet Balance (own profile) -->
  <div class="wallet-pill" id="walletPill" style="display:none" onclick="window.location='wallet.html'">
    <span class="wp-coin">💰</span>
    <div>
      <div class="wp-label">Wallet Balance</div>
      <div class="wp-amount" id="walletAmount">0 UGX</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-item" onclick="openModal('videos')">
      <div class="stat-number" id="videoCount">0</div>
      <div class="stat-label">Videos</div>
    </div>
    <div class="stat-item" onclick="openModal('following')">
      <div class="stat-number" id="followingCount">0</div>
      <div class="stat-label">Following</div>
    </div>
    <div class="stat-item" onclick="openModal('followers')">
      <div class="stat-number" id="followersCount">0</div>
      <div class="stat-label">Followers</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="likesCount">0</div>
      <div class="stat-label">Likes</div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="action-row">
    <div id="profileActions" style="display:none">
      <button class="follow-btn not-following" id="followBtn" onclick="toggleFollow()">Follow</button>
      <button class="msg-btn" onclick="shareProfile()">Share</button>
    </div>
    <div id="ownActions" style="display:none">
      <button class="edit-btn" onclick="openEditModal()">✏️ Edit Profile</button>
    </div>
  </div>
  <div style="height:12px"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('videos', this)">📹 Videos</div>
  <div class="tab" onclick="switchTab('liked', this)">❤️ Liked</div>
  <div class="tab" onclick="switchTab('saved', this)">🔖 Saved</div>
</div>

<!-- VIDEO GRID -->
<div class="videos-grid" id="videosGrid"></div>
<div class="spacer"></div>

<!-- FOLLOWERS/FOLLOWING MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Followers</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div class="modal-overlay" id="editModal" onclick="closeEditModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Edit Profile</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="edit-form">
      <div class="edit-field">
        <label>Display Name</label>
        <input type="text" id="editName" placeholder="Your name" maxlength="50">
      </div>
      <div class="edit-field">
        <label>Username</label>
        <input type="text" id="editUsername" placeholder="@username" maxlength="30">
      </div>
      <div class="edit-field">
        <label>Bio</label>
        <textarea id="editBio" placeholder="Tell people about yourself..." maxlength="150"></textarea>
      </div>
      <div class="edit-field">
        <label>Phone Number</label>
        <input type="tel" id="editPhone" placeholder="+256 700 000 000">
      </div>

      <div class="edit-section-title">🔗 Social Links (optional)</div>

      <div class="edit-field">
        <label>TikTok</label>
        <input type="url" id="editTiktok" placeholder="https://tiktok.com/@you">
      </div>
      <div class="edit-field">
        <label>Instagram</label>
        <input type="url" id="editInstagram" placeholder="https://instagram.com/you">
      </div>
      <div class="edit-field">
        <label>YouTube</label>
        <input type="url" id="editYoutube" placeholder="https://youtube.com/@you">
      </div>
      <div class="edit-field">
        <label>WhatsApp</label>
        <input type="tel" id="editWhatsapp" placeholder="+256 700 000 000">
      </div>
      <div class="edit-field">
        <label>Twitter / X</label>
        <input type="url" id="editTwitter" placeholder="https://x.com/you">
      </div>
      <div class="edit-field">
        <label>Website / Other Link</label>
        <input type="url" id="editWebsite" placeholder="https://yoursite.com">
      </div>

      <button class="save-btn" onclick="saveProfile()">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Home</a>
  <a href="trending.html"><span class="icon">🔥</span>Trending</a>
  <a href="upload.html"><span class="icon">➕</span>Upload</a>
  <a href="notifications.html"><span class="icon">🔔</span>Inbox</a>
  <a href="profile.html" class="active"><span class="icon">👤</span>Profile</a>
</nav>

<script>
const API = "";
const params = new URLSearchParams(window.location.search);
const myId = JSON.parse(localStorage.getItem('hvu') || '{}').id;
const profileUserId = params.get('id') || myId;
const isOwnProfile = !params.get('id') || params.get('id') == myId;
let isFollowing = false;
let profileData = {};

// If own profile but not logged in, redirect to login
if (!profileUserId) {
  window.location.href = 'index.html?login=1';
}

const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : (n || 0);
const fmtUGX = n => n >= 1e6 ? (n/1e6).toFixed(2)+' M UGX' : n >= 1e3 ? (n/1e3).toFixed(0)+' K UGX' : (n || 0)+' UGX';

function toast(msg, duration=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function showProfileError(msg) {
  document.getElementById('profileUsername').textContent = msg || 'User not found';
  document.getElementById('profileHandle').textContent = '';
  document.getElementById('avatarPlaceholder').textContent = '?';
}

async function loadProfile() {
  try {
    const res = await fetch(`${API}/api/users/${profileUserId}/profile`);
    const data = await res.json();
    if (!data.success) {
      showProfileError(data.message || 'Could not load profile');
      return;
    }
    profileData = data.data;
    renderProfile(profileData);
    loadVideos();
    if (isOwnProfile) loadWallet();
  } catch (err) {
    console.error('loadProfile error:', err);
    showProfileError('Network error. Pull down to refresh.');
  }
}

function renderProfile(u) {
  document.title = `@${u.username} – HOTVID`;
  document.getElementById('profileUsername').textContent = u.display_name || u.username;
  document.getElementById('profileHandle').textContent = '@' + u.username;
  document.getElementById('profileBio').textContent = u.bio || '';
  document.getElementById('followersCount').textContent = fmt(u.followers_count);
  document.getElementById('followingCount').textContent = fmt(u.following_count);
  document.getElementById('likesCount').textContent = fmt(u.total_likes);
  document.getElementById('videoCount').textContent = fmt(u.video_count);

  // Avatar
  if (u.avatar_url) {
    const img = document.getElementById('avatarImg');
    img.src = u.avatar_url;
    img.style.display = 'block';
    document.getElementById('avatarPlaceholder').style.display = 'none';
  } else {
    document.getElementById('avatarPlaceholder').textContent = (u.username||'?')[0].toUpperCase();
  }

  // Social links
  const sl = document.getElementById('socialLinks');
  const links = [];
  const socials = u.socials || {};
  if (socials.tiktok) links.push(`<a class="social-link" href="${socials.tiktok}" target="_blank"><span class="sl-icon">🎵</span>TikTok</a>`);
  if (socials.instagram) links.push(`<a class="social-link" href="${socials.instagram}" target="_blank"><span class="sl-icon">📸</span>Instagram</a>`);
  if (socials.youtube) links.push(`<a class="social-link" href="${socials.youtube}" target="_blank"><span class="sl-icon">▶️</span>YouTube</a>`);
  if (socials.twitter) links.push(`<a class="social-link" href="${socials.twitter}" target="_blank"><span class="sl-icon">🐦</span>X</a>`);
  if (socials.whatsapp) links.push(`<a class="social-link" href="https://wa.me/${socials.whatsapp.replace(/\D/g,'')}" target="_blank"><span class="sl-icon">💬</span>WhatsApp</a>`);
  if (socials.website) links.push(`<a class="social-link" href="${socials.website}" target="_blank"><span class="sl-icon">🌐</span>Website</a>`);
  sl.innerHTML = links.join('');

  if (isOwnProfile) {
    document.getElementById('settingsBtn').style.display = 'flex';
    document.getElementById('avatarEditBtn').classList.add('visible');
    document.getElementById('ownActions').style.display = 'block';
    // Contact
    if (u.phone || u.email) {
      const cr = document.getElementById('contactRow');
      cr.style.display = 'flex';
      let c = '';
      if (u.phone) c += `<span>📱 ${u.phone}</span>`;
      if (u.email) c += `<span>✉️ ${u.email}</span>`;
      cr.innerHTML = c;
    }
  } else if (myId) {
    document.getElementById('profileActions').style.display = 'block';
    checkFollowStatus();
  }
}

async function loadWallet() {
  try {
    const token = localStorage.getItem('hvt');
    if (!token) return;
    const res = await fetch(`${API}/api/gifts/wallet`, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    const bal = data.balance || 0;
    document.getElementById('walletAmount').textContent = fmtUGX(bal);
    document.getElementById('walletPill').style.display = 'inline-flex';
  } catch(e) {}
}

async function checkFollowStatus() {
  const token = localStorage.getItem('hvt');
  if (!token) return;
  try {
    const res = await fetch(`${API}/api/users/${profileUserId}/follow-status`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.success) updateFollowBtn(data.following);
  } catch (e) {}
}

async function toggleFollow() {
  const token = localStorage.getItem('hvt');
  if (!token) { toast('Login to follow creators'); return; }
  const btn = document.getElementById('followBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/api/users/${profileUserId}/follow`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.success) {
      updateFollowBtn(data.following);
      const el = document.getElementById('followersCount');
      const n = parseInt(el.textContent) || 0;
      el.textContent = fmt(data.following ? n + 1 : Math.max(n - 1, 0));
      toast(data.following ? '✅ Following' : 'Unfollowed');
    }
  } catch (err) { console.error(err); }
  btn.disabled = false;
}

function updateFollowBtn(following) {
  isFollowing = following;
  const btn = document.getElementById('followBtn');
  btn.textContent = following ? 'Following' : 'Follow';
  btn.className = 'follow-btn ' + (following ? 'following' : 'not-following');
}

function shareProfile() {
  const url = `${location.origin}/profile.html?id=${profileUserId}`;
  if (navigator.share) {
    navigator.share({ title: `@${profileData.username} on HOTVID`, url });
  } else {
    navigator.clipboard?.writeText(url).then(() => toast('Profile link copied!'));
  }
}

// ---- AVATAR UPLOAD ----
async function handleAvatarChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Image too large (max 5MB)'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    const dataUrl = e.target.result;
    // Show locally immediately
    const img = document.getElementById('avatarImg');
    img.src = dataUrl;
    img.style.display = 'block';
    document.getElementById('avatarPlaceholder').style.display = 'none';
    // Save to server as base64 URL (server should handle or use direct URL)
    await saveAvatarUrl(dataUrl);
  };
  reader.readAsDataURL(file);
}

async function saveAvatarUrl(url) {
  const token = localStorage.getItem('hvt');
  if (!token) return;
  try {
    await fetch(`${API}/api/users/profile`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ avatar_url: url })
    });
    toast('✅ Profile photo updated');
  } catch(e) { toast('Failed to update photo'); }
}

// ---- EDIT MODAL ----
function openEditModal() {
  const u = profileData;
  document.getElementById('editName').value = u.display_name || '';
  document.getElementById('editUsername').value = u.username || '';
  document.getElementById('editBio').value = u.bio || '';
  document.getElementById('editPhone').value = u.phone || '';
  const s = u.socials || {};
  document.getElementById('editTiktok').value = s.tiktok || '';
  document.getElementById('editInstagram').value = s.instagram || '';
  document.getElementById('editYoutube').value = s.youtube || '';
  document.getElementById('editWhatsapp').value = s.whatsapp || '';
  document.getElementById('editTwitter').value = s.twitter || '';
  document.getElementById('editWebsite').value = s.website || '';
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal(e) {
  if (!e || e.target === document.getElementById('editModal')) {
    document.getElementById('editModal').classList.remove('open');
  }
}

async function saveProfile() {
  const token = localStorage.getItem('hvt');
  if (!token) return;
  const payload = {
    display_name: document.getElementById('editName').value.trim(),
    username: document.getElementById('editUsername').value.trim().replace('@',''),
    bio: document.getElementById('editBio').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    socials: {
      tiktok: document.getElementById('editTiktok').value.trim(),
      instagram: document.getElementById('editInstagram').value.trim(),
      youtube: document.getElementById('editYoutube').value.trim(),
      whatsapp: document.getElementById('editWhatsapp').value.trim(),
      twitter: document.getElementById('editTwitter').value.trim(),
      website: document.getElementById('editWebsite').value.trim(),
    }
  };
  // Remove empty socials
  Object.keys(payload.socials).forEach(k => { if (!payload.socials[k]) delete payload.socials[k]; });

  try {
    const res = await fetch(`${API}/api/users/profile`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success || data.message) {
      toast('✅ Profile saved!');
      closeEditModal();
      loadProfile();
    } else {
      toast(data.error || 'Save failed');
    }
  } catch(e) { toast('Network error. Try again.'); }
}

// ---- VIDEOS GRID ----
let currentTab = 'videos';

async function loadVideos() {
  const grid = document.getElementById('videosGrid');
  grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:#333;">Loading...</div>`;
  try {
    const token = localStorage.getItem('hvt');
    const headers = token ? { Authorization: 'Bearer ' + token } : {};
    const res = await fetch(`${API}/api/users/${profileUserId}/videos`, { headers });
    const data = await res.json();
    if (!data.success || !data.data?.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
        <div style="font-size:48px;margin-bottom:12px">🎬</div>
        <div>${isOwnProfile ? 'Upload your first video!' : 'No videos yet'}</div>
        ${isOwnProfile ? '<a href="upload.html" style="display:inline-block;margin-top:16px;background:var(--hot);color:white;padding:10px 24px;border-radius:8px;font-weight:700;text-decoration:none">Upload 🔥</a>' : ''}
      </div>`;
      return;
    }
    renderGrid(data.data);
  } catch(err) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Failed to load videos</div>`;
  }
}

function renderGrid(vids) {
  document.getElementById('videosGrid').innerHTML = vids.map(v => `
    <div class="video-thumb" onclick="window.location='index.html?v=${v.id}'">
      <img src="${v.thumbnail_url || 'https://placehold.co/200x355/141414/333?text=▶'}"
        alt="${v.title || ''}" loading="lazy"
        onerror="this.src='https://placehold.co/200x355/141414/333?text=▶'"/>
      <div class="video-thumb-meta">
        <div class="vt-views">👁️ ${fmt(v.view_count || v.views || 0)}</div>
        <div class="vt-likes">❤️ ${fmt(v.like_count || v.likes_count || 0)}</div>
      </div>
    </div>
  `).join('');
}

async function loadLikedVideos() {
  const grid = document.getElementById('videosGrid');
  grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:#333;">Loading...</div>`;
  const token = localStorage.getItem('hvt');
  if (!token && isOwnProfile) {
    grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">❤️</div><div>Login to see liked videos</div></div>`;
    return;
  }
  try {
    const res = await fetch(`${API}/api/users/${profileUserId}/liked-videos`, {
      headers: token ? { Authorization: 'Bearer ' + token } : {}
    });
    const data = await res.json();
    if (!data.success || !data.data?.length) {
      grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">❤️</div><div>No liked videos yet</div></div>`;
      return;
    }
    renderGrid(data.data);
  } catch(e) {
    grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">❤️</div><div>Could not load liked videos</div></div>`;
  }
}

async function loadSavedVideos() {
  const grid = document.getElementById('videosGrid');
  grid.innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:#333;">Loading...</div>`;
  const token = localStorage.getItem('hvt');
  if (!token) {
    grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">🔖</div><div>Login to see saved videos</div></div>`;
    return;
  }
  try {
    const res = await fetch(`${API}/api/users/${profileUserId}/saved-videos`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (!data.success || !data.data?.length) {
      grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">🔖</div><div>No saved videos yet</div></div>`;
      return;
    }
    renderGrid(data.data);
  } catch(e) {
    grid.innerHTML = `<div class="liked-empty" style="grid-column:1/-1"><div class="icon">🔖</div><div>Could not load saved videos</div></div>`;
  }
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'videos') loadVideos();
  else if (tab === 'liked') loadLikedVideos();
  else if (tab === 'saved') loadSavedVideos();
}

// ---- MODALS ----
async function openModal(type) {
  if (type === 'videos') return; // clicking stat just scrolls
  document.getElementById('modalTitle').textContent = type === 'followers' ? 'Followers' : 'Following';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalList').innerHTML = '<div style="padding:20px;text-align:center;color:#555">Loading...</div>';
  try {
    const endpoint = type === 'followers'
      ? `/api/users/${profileUserId}/followers`
      : `/api/users/${profileUserId}/following`;
    const res = await fetch(`${API}${endpoint}`);
    const data = await res.json();
    renderUserList(data.data || []);
  } catch(e) {
    document.getElementById('modalList').innerHTML = '<div style="padding:20px;text-align:center;color:#555">Failed to load</div>';
  }
}

function renderUserList(users) {
  const list = document.getElementById('modalList');
  if (!users.length) {
    list.innerHTML = '<div style="padding:30px;text-align:center;color:#555">No users yet</div>';
    return;
  }
  list.innerHTML = users.map(u => `
    <div class="user-row" onclick="window.location='profile.html?id=${u.id}'">
      <div class="user-row-avatar">
        ${u.avatar_url ? `<img src="${u.avatar_url}" alt="${u.username}" onerror="this.style.display='none'">` : u.username[0].toUpperCase()}
      </div>
      <div class="user-row-info">
        <div class="user-row-name">@${u.username}</div>
        <div class="user-row-sub">${fmt(u.followers_count)} followers</div>
      </div>
    </div>
  `).join('');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// Init
loadProfile();
</script>
