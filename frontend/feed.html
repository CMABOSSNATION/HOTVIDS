<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOTVID</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;height:100vh;width:100vw;}

#feed{height:100vh;width:100vw;overflow:hidden;position:relative;}
.video-slide{position:absolute;top:0;left:0;width:100%;height:100%;transition:transform .3s ease;}

video{width:100%;height:100%;object-fit:cover;}

/* OVERLAY */
.overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 40%,transparent 70%,rgba(0,0,0,.3) 100%);}

/* VIDEO INFO */
.vinfo{position:absolute;bottom:80px;left:16px;right:72px;}
.vinfo .creator{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.vinfo .creator span{color:#e50000;}
.vinfo .vtitle{font-size:14px;color:#ddd;margin-bottom:6px;line-height:1.4;}
.vinfo .tags{font-size:13px;color:#e50000;}

/* ACTIONS */
.actions{position:absolute;bottom:80px;right:12px;display:flex;flex-direction:column;gap:20px;align-items:center;}
.abtn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.abtn .aicon{font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));}
.abtn .acount{font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.avatar-ring{width:44px;height:44px;border-radius:50%;border:2px solid #e50000;overflow:hidden;margin-bottom:-8px;}
.avatar-ring img{width:100%;height:100%;object-fit:cover;}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);}
.tlogo{color:#e50000;font-weight:900;font-size:22px;letter-spacing:2px;}
.ttabs{display:flex;gap:20px;}
.ttab{color:#aaa;font-size:15px;font-weight:600;cursor:pointer;padding-bottom:4px;}
.ttab.active{color:#fff;border-bottom:2px solid #e50000;}
.tsearch{font-size:22px;cursor:pointer;}

/* BOTTOM NAV */
#botnav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:60px;background:rgba(0,0,0,.95);border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-around;}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 12px;}
.nbtn .ni{font-size:22px;}
.nbtn .nl{font-size:10px;color:#555;}
.nbtn.active .nl{color:#e50000;}
.upload-btn{background:#e50000;border:none;border-radius:10px;width:44px;height:32px;font-size:22px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* MUTE INDICATOR */
#mute-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;}

/* LOADING */
#loader{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.spin{width:40px;height:40px;border:3px solid #222;border-top-color:#e50000;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN PROMPT */
#loginprompt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #e50000;border-radius:12px;padding:14px 20px;z-index:500;text-align:center;display:none;white-space:nowrap;}
#loginprompt p{font-size:12px;color:#aaa;margin-bottom:8px;}
#loginprompt button{background:#e50000;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;}

/* COMMENTS PANEL */
#comments-panel{position:fixed;bottom:0;left:0;right:0;height:70vh;background:#111;border-radius:20px 20px 0 0;z-index:300;transform:translateY(100%);transition:transform .3s ease;}
#comments-panel.open{transform:translateY(0);}
.cp-header{padding:16px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;}
.cp-header h3{font-size:16px;font-weight:700;}
.cp-close{font-size:22px;cursor:pointer;color:#666;}
.cp-list{height:calc(70vh - 120px);overflow-y:auto;padding:12px 16px;}
.comment-item{display:flex;gap:10px;margin-bottom:16px;}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:#333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.comment-body .cuser{font-size:13px;font-weight:700;color:#e50000;}
.comment-body .ctext{font-size:14px;color:#ddd;margin-top:2px;}
.cp-input{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:#111;border-top:1px solid #222;display:flex;gap:10px;}
.cp-input input{flex:1;background:#222;border:none;border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;outline:none;}
.cp-input button{background:#e50000;border:none;border-radius:20px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;}

/* GIFTS PANEL */
#gifts-panel{position:fixed;bottom:0;left:0;right:0;height:50vh;background:#111;border-radius:20px 20px 0 0;z-index:300;transform:translateY(100%);transition:transform .3s ease;padding:20px;}
#gifts-panel.open{transform:translateY(0);}
.gifts-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px;}
.gift-item{text-align:center;cursor:pointer;padding:10px 4px;border-radius:12px;border:2px solid transparent;transition:.2s;}
.gift-item.sel{border-color:#e50000;background:#1a0000;}
.gift-item .ge{font-size:28px;}
.gift-item .gn{font-size:10px;color:#aaa;margin-top:4px;}
.gift-item .gp{font-size:11px;color:#e50000;font-weight:700;}
.send-gift-btn{width:100%;background:#e50000;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;}

/* GIFT ANIMATION */
#giftanim{position:fixed;inset:0;pointer-events:none;z-index:9998;}
.flying{position:absolute;font-size:50px;animation:fly 1.5s ease-out forwards;}
@keyframes fly{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-60vh) scale(2);opacity:0;}}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div style="color:#666;font-size:13px;margin-top:12px;">Loading HOTVID...</div></div>

<div id="topbar">
  <span class="tlogo">🔥HOTVID</span>
  <div class="ttabs">
    <span class="ttab" onclick="loadTab('following')">Following</span>
    <span class="ttab active" onclick="loadTab('trending')">For You</span>
  </div>
  <span class="tsearch" onclick="goSearch()">🔍</span>
</div>

<div id="feed"></div>

<div id="mute-indicator">🔇</div>

<div id="botnav">
  <div class="nbtn active" onclick="location.href='/'"><span class="ni">🏠</span><span class="nl">Home</span></div>
  <div class="nbtn" onclick="goSearch()"><span class="ni">🔍</span><span class="nl">Discover</span></div>
  <button class="upload-btn" onclick="requireAuth('upload')">➕</button>
  <div class="nbtn" onclick="requireAuth('inbox')"><span class="ni">🔔</span><span class="nl">Inbox</span></div>
  <div class="nbtn" onclick="requireAuth('profile')"><span class="ni">👤</span><span class="nl">Me</span></div>
</div>

<div id="loginprompt">
  <p>Join HOTVID to interact with creators</p>
  <button onclick="location.href='/?login=1'">Sign Up Free 🔥</button>
</div>

<!-- COMMENTS PANEL -->
<div id="comments-panel">
  <div class="cp-header">
    <h3 id="cp-title">Comments</h3>
    <span class="cp-close" onclick="closeComments()">✕</span>
  </div>
  <div class="cp-list" id="cp-list"></div>
  <div class="cp-input">
    <input type="text" id="cp-input" placeholder="Add a comment...">
    <button onclick="postComment()">Post</button>
  </div>
</div>

<!-- GIFTS PANEL -->
<div id="gifts-panel">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h3 style="font-size:16px;font-weight:700;">Send a Gift</h3>
    <span style="font-size:22px;cursor:pointer;color:#666;" onclick="closeGifts()">✕</span>
  </div>
  <div class="gifts-grid" id="gifts-grid"></div>
  <button class="send-gift-btn" onclick="sendGift()">Send Gift 🎁</button>
</div>

<div id="giftanim"></div>

<script>
const API = 'http://178.105.190.123';
let token = localStorage.getItem('hvt');
let user = null;
try{ user = JSON.parse(localStorage.getItem('hvu')); }catch(e){}

let videos = [];
let currentIdx = 0;
let isMuted = true;
let touchStartY = 0;
let currentVideoId = null;
let currentCreatorId = null;
let selectedGift = null;

const GIFTS = {
  rose:{name:'Rose',emoji:'🌹',price:500},
  trophy:{name:'Trophy',emoji:'🏆',price:5000},
  rocket:{name:'Rocket',emoji:'🚀',price:25000},
  crown:{name:'Crown',emoji:'👑',price:100000},
  diamond:{name:'Diamond',emoji:'💎',price:500000}
};

// Load feed
async function loadFeed(type='trending'){
  try{
    const url = type==='following' && token ?
      API+'/api/feed' : API+'/api/feed/trending';
    const headers = token ? {Authorization:'Bearer '+token} : {};
    const r = await fetch(url,{headers});
    const d = await r.json();
    videos = d.videos||[];
    document.getElementById('loader').style.display='none';
    if(videos.length===0){ showEmpty(); return; }
    renderAll();
    playVideo(0);
    setupSwipe();
  }catch(e){
    document.getElementById('loader').style.display='none';
    showEmpty();
  }
}

function showEmpty(){
  document.getElementById('feed').innerHTML = `
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;">
      <div style="font-size:64px">🎬</div>
      <div style="font-size:20px;font-weight:700;">No videos yet</div>
      <div style="color:#666;font-size:14px;">Be the first creator on HOTVID Uganda!</div>
      <button onclick="requireAuth('upload')" style="background:#e50000;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;">Upload First Video 🔥</button>
    </div>`;
}

function renderAll(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  videos.forEach((v,i)=>{
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.id = 'slide-'+i;
    slide.style.transform = `translateY(${i*100}%)`;
    const cfId = v.cloudflare_video_id;
    slide.innerHTML = `
      ${cfId ?
        `<video id="vid-${i}" src="https://videodelivery.net/${cfId}/manifest/video.m3u8"
          loop playsinline ${isMuted?'muted':''} onclick="toggleMute()"
          style="width:100%;height:100%;object-fit:cover;"></video>` :
        `<div style="width:100%;height:100%;background:linear-gradient(135deg,#1a0000 0%,#000 100%);display:flex;align-items:center;justify-content:center;">
          <span style="font-size:80px">🎬</span>
        </div>`
      }
      <div class="overlay"></div>
      <div class="vinfo">
        <div class="creator">@<span>${v.username||'creator'}</span></div>
        <div class="vtitle">${v.title||''}</div>
        <div class="tags">${v.hashtags||''}</div>
      </div>
      <div class="actions">
        <div style="margin-bottom:4px;">
          <div class="avatar-ring"><img src="${v.avatar||'https://ui-avatars.com/api/?name='+encodeURIComponent(v.username||'U')+'&background=e50000&color=fff'}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=e50000&color=fff'"></div>
        </div>
        <div class="abtn" onclick="handleLike('${v.id}',this)">
          <span class="aicon">❤️</span>
          <span class="acount">${fmt(v.likes||0)}</span>
        </div>
        <div class="abtn" onclick="openComments('${v.id}')">
          <span class="aicon">💬</span>
          <span class="acount">${fmt(v.comments||0)}</span>
        </div>
        <div class="abtn" onclick="openGifts('${v.id}','${v.creator_id}')">
          <span class="aicon">🎁</span>
          <span class="acount">Gift</span>
        </div>
        <div class="abtn" onclick="shareVideo('${v.id}')">
          <span class="aicon">↗️</span>
          <span class="acount">Share</span>
        </div>
      </div>`;
    feed.appendChild(slide);
  });
}

function playVideo(idx){
  // Pause all
  document.querySelectorAll('video').forEach(v=>{ try{v.pause();}catch(e){} });
  currentIdx = idx;
  currentVideoId = videos[idx]?.id;
  currentCreatorId = videos[idx]?.creator_id;
  const vid = document.getElementById('vid-'+idx);
  if(vid){ vid.muted=isMuted; try{vid.play();}catch(e){} }
  // Record view
  if(currentVideoId) fetch(API+'/api/videos/'+currentVideoId+'/view',{method:'POST'}).catch(()=>{});
}

// SWIPE
function setupSwipe(){
  const feed = document.getElementById('feed');
  feed.addEventListener('touchstart',e=>{ touchStartY=e.touches[0].clientY; },{passive:true});
  feed.addEventListener('touchend',e=>{
    const diff = touchStartY - e.changedTouches[0].clientY;
    if(Math.abs(diff) > 60){
      if(diff>0 && currentIdx<videos.length-1) goTo(currentIdx+1);
      else if(diff<0 && currentIdx>0) goTo(currentIdx-1);
    }
  },{passive:true});
}

function goTo(idx){
  const prev = document.getElementById('slide-'+currentIdx);
  const next = document.getElementById('slide-'+idx);
  if(prev) prev.style.transform = `translateY(${(currentIdx-idx)*-100}%)`;
  if(next) next.style.transform = 'translateY(0)';
  // Reset other slides
  videos.forEach((_,i)=>{
    if(i!==currentIdx && i!==idx){
      const s = document.getElementById('slide-'+i);
      if(s) s.style.transform = `translateY(${(i-idx)*100}%)`;
    }
  });
  playVideo(idx);
}

function toggleMute(){
  isMuted = !isMuted;
  const vid = document.getElementById('vid-'+currentIdx);
  if(vid) vid.muted = isMuted;
  const ind = document.getElementById('mute-indicator');
  ind.textContent = isMuted ? '🔇' : '🔊';
  ind.style.opacity = '1';
  setTimeout(()=>ind.style.opacity='0', 800);
}

function fmt(n){ return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n); }

// ACTIONS
function handleLike(id, btn){
  if(!token){ showLoginPrompt(); return; }
  fetch(API+'/api/videos/'+id+'/like',{method:'POST',headers:{Authorization:'Bearer '+token}})
    .then(()=>{ if(btn){ btn.querySelector('.aicon').textContent='❤️'; } });
}

function requireAuth(action){
  if(!token){ showLoginPrompt(); return; }
  if(action==='upload') location.href='/upload.html';
  if(action==='profile') location.href='/profile.html';
  if(action==='inbox') location.href='/inbox.html';
}

function showLoginPrompt(){
  const p = document.getElementById('loginprompt');
  p.style.display='block';
  setTimeout(()=>p.style.display='none',3000);
}

function goSearch(){ location.href='/search.html'; }
function shareVideo(id){
  if(navigator.share) navigator.share({title:'Watch on HOTVID',url:API+'/?v='+id});
}

function loadTab(type){
  document.querySelectorAll('.ttab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  loadFeed(type);
}

// COMMENTS
async function openComments(videoId){
  if(!token){ showLoginPrompt(); return; }
  currentVideoId = videoId;
  document.getElementById('comments-panel').classList.add('open');
  const list = document.getElementById('cp-list');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">Loading...</div>';
  try{
    const r = await fetch(API+'/api/videos/'+videoId+'/comments');
    const comments = await r.json();
    if(!comments.length){ list.innerHTML='<div style="text-align:center;padding:20px;color:#666;">No comments yet. Be first!</div>'; return; }
    list.innerHTML = comments.map(c=>`
      <div class="comment-item">
        <div class="comment-avatar">👤</div>
        <div class="comment-body">
          <div class="cuser">@${c.username}</div>
          <div class="ctext">${c.text}</div>
        </div>
      </div>`).join('');
  }catch(e){ list.innerHTML='<div style="color:#e50000;text-align:center;padding:20px;">Failed to load comments</div>'; }
}

function closeComments(){ document.getElementById('comments-panel').classList.remove('open'); }

async function postComment(){
  if(!token){ showLoginPrompt(); return; }
  const input = document.getElementById('cp-input');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  try{
    await fetch(API+'/api/videos/'+currentVideoId+'/comments',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({text})
    });
    openComments(currentVideoId);
  }catch(e){}
}

// GIFTS
function openGifts(videoId, creatorId){
  if(!token){ showLoginPrompt(); return; }
  currentVideoId = videoId;
  currentCreatorId = creatorId;
  selectedGift = null;
  const grid = document.getElementById('gifts-grid');
  grid.innerHTML = Object.entries(GIFTS).map(([key,g])=>`
    <div class="gift-item" onclick="selectGift('${key}',this)">
      <div class="ge">${g.emoji}</div>
      <div class="gn">${g.name}</div>
      <div class="gp">${g.price.toLocaleString()} UGX</div>
    </div>`).join('');
  document.getElementById('gifts-panel').classList.add('open');
}

function selectGift(key, el){
  document.querySelectorAll('.gift-item').forEach(i=>i.classList.remove('sel'));
  el.classList.add('sel');
  selectedGift = key;
}

function closeGifts(){ document.getElementById('gifts-panel').classList.remove('open'); }

async function sendGift(){
  if(!selectedGift){ alert('Select a gift first'); return; }
  try{
    const r = await fetch(API+'/api/gifts/send',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({recipient_id:currentCreatorId,gift_type:selectedGift,video_id:currentVideoId})
    });
    const d = await r.json();
    if(d.error){ alert(d.error); return; }
    closeGifts();
    animateGift(GIFTS[selectedGift].emoji);
  }catch(e){ alert('Failed to send gift'); }
}

function animateGift(emoji){
  const container = document.getElementById('giftanim');
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'flying';
      el.textContent = emoji;
      el.style.left = (20+Math.random()*60)+'%';
      el.style.bottom = '15%';
      container.appendChild(el);
      setTimeout(()=>el.remove(),1500);
    },i*200);
  }
}

// START
loadFeed();
</script>
</body>
      </html>
